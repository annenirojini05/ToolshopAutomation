name: Toolshop Automation CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Toolshop availability
        run: |
          curl -I https://practicesoftwaretesting.com

      - name: Run Toolshop smoke tests
        run: >
          mvn clean test
          "-Dheadless=true"
          "-Dsurefire.suiteXmlFiles=src/test/resources/smoke-testng.xml"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolshop-test-evidence
          path: |
            target/screenshots
            target/surefire-reports