name: Toolshop Automation CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Toolshop smoke tests
        run: >
          mvn clean test
          "-Dheadless=true"
          "-Dsurefire.suiteXmlFiles=src/test/resources/smoke-testng.xml"